# Prod deployment on the Pi, lives in /opt/yami.
# Auto-update via crontab of hoppix:
#   */5 * * * * flock -n /tmp/yami-deploy.lock sh -c 'cd /opt/yami && docker compose pull -q && docker compose up -d && docker image prune -f' 2>&1 | logger -t yami-deploy
# Deploy output: journalctl -t yami-deploy
services:
  yami:
    image: ghcr.io/hoppix/yami_bot:prod
    restart: unless-stopped
    volumes:
      - ./config/api_config.json:/app/resources/api_config.json:ro
      - ./data/commands:/tmp/yami/commands
      - ./data/logs:/tmp/yami/logs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 1m
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: 10m
        max-file: "3"
