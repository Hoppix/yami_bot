name: Test Yami

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    # every day at 7 pm
    - cron:  "0 19 * * *"
  workflow_dispatch:

concurrency: yami

jobs:
  build:
    # same arch as the Pi, so the smoke test covers what gets deployed
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.4.0
    - run: uv sync --frozen
    - name: allow ci scripts
      run: chmod 777 ci/*.sh
    - name: write .env for smoke test
      run: echo "DISCORDTOKEN=${{ secrets.DISCORDTOKEN }}" > .env
    - name: lint
      run: |
        uv run ruff check src test
        uv run ruff format --check src test
    - name: run tests
      run: uv run pytest
    - name: Build and run the image
      run: ./ci/build_and_run.sh
    - name: Run smoke test
      run: ./ci/smoke_test.sh
