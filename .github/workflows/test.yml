name: Test Yami

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    # every day at 7 pm
    - cron:  "0 19 * * *"
  workflow_dispatch:

concurrency: yami

jobs:
  build:
    # same arch as the Pi, so the smoke test covers what gets deployed
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.4.0
    - run: uv sync --frozen
    - name: allow ci scripts
      run: chmod 777 ci/*.sh
    - name: write api config for smoke test
      run: |
        cat << EOF > resources/api_config.json
        {
          "token":  "${{ secrets.DISCORDTOKEN }}",
          "youtubeClient": "${{ secrets.YOUTUBECLIENT }}"
        }
        EOF
    - name: lint
      run: make lint
    - name: run tests
      run: make check
    - name: Build and run the image
      run: ./ci/build_and_run.sh
    - name: Run smoke test
      run: ./ci/smoke_test.sh
