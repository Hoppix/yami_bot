name: Publish Yami

# main only changes through PRs that passed test.yml (branch protection)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # push the version tag
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # tags for the version bump
    - uses: astral-sh/setup-uv@v10.4.0

    # major.minor comes from pyproject.toml (bumped by hand), patch counts up from the last tag
    - name: determine version
      id: version
      run: |
        base=$(uv version --short)
        major_minor=${base%.*}
        last_tag=$(git tag --list "v${major_minor}.*" --sort=-v:refname | head -1)
        if [ -z "$last_tag" ]; then
          version=$base
        else
          last_patch=${last_tag##*.}
          version="${major_minor}.$((last_patch + 1))"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Publishing version $version"

    # only inside the build context, so the image reports the published version
    - run: uv version "${{ steps.version.outputs.version }}" --no-sync

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ghcr.io/hoppix/yami_bot:prod
          ghcr.io/hoppix/yami_bot:${{ steps.version.outputs.version }}
          ghcr.io/hoppix/yami_bot:${{ github.sha }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

    - name: tag release
      run: |
        git tag "v${{ steps.version.outputs.version }}"
        git push origin "v${{ steps.version.outputs.version }}"
