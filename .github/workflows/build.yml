name: Build Yami

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    branches: [ "master", "main", "dev" ]
  schedule:
    # every day at 7 pm
    - cron:  "0 19 * * *"
  workflow_dispatch:

concurrency: yami

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 23
    - run: npm install
    - name: allow ci scripts
      run: chmod 777 ci/*.sh
    - name: write api config for smoke test
      run: |
        cat << EOF > resources/api_config.json
        {
          "token":  "${{ secrets.DISCORDTOKEN }}",
          "twitchClient": "${{ secrets.TWITCHTOKEN }}",
          "youtubeClient": "${{ secrets.YOUTUBECLIENT }}"
        }
        EOF
    - name: create temp files
      run: |
        mkdir logs
        touch logs/log.txt
        mkdir resources/commands
        touch resources/commands/custom.json
        cat << EOF > resources/commands/custom.json
        []
        EOF
    - name: build typescript
      run: make compile
    - name: run tests
      run: make check
    - name: Build and run the image
      run: ./ci/build_and_run.sh
    - name: Run smoke test
      run: ./ci/smoke_test.sh

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ghcr.io/hoppix/yami_bot:prod
          ghcr.io/hoppix/yami_bot:${{ github.sha }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
