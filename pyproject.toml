[project]
name = "yami-bot"
version = "3.0.0"
description = "Discord bot Yami"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "beautifulsoup4>=4.15.0",
    # davey 0.2 changed the DAVE key transitions, discord.py 2.7.1 then sends audio clients cannot decrypt (Rapptz/discord.py#10548)
    "davey>=0.1.7,<0.2",
    "discord-py[voice]>=2.7.1",
    "python-dateutil>=4.0.0",
    "yt-dlp>=2026.11.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# installed so importlib.metadata knows the version; modules stay top-level (bot, utility, mh, ...)
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.ruff]
src = ["src", "test"]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
